<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">个人 Markdown 笔记工具主界面原型</title>
  <desc id="desc">黑白简约界面，顶部工具栏，左侧文件夹与笔记列表，中部编辑预览，编辑区上方显示右键菜单。</desc>
  <rect width="1440" height="850" fill="#f2f2ef"/>
  <rect width="1440" height="70" fill="#fff"/><path d="M0 70H1440" stroke="#c9c9c3"/>
  <text x="28" y="43" font-family="Microsoft YaHei" font-size="23" font-weight="700" fill="#171717">个人 Markdown 笔记</text>
  <rect x="260" y="21" width="78" height="28" rx="3" fill="#f5f5f2" stroke="#c9c9c3"/><text x="299" y="40" text-anchor="middle" font-family="Consolas" font-size="12" fill="#666">交互原型</text>
  <g font-family="Microsoft YaHei" font-size="14"><rect x="900" y="16" width="104" height="38" rx="4" fill="#171717"/><text x="952" y="40" text-anchor="middle" fill="#fff">新建笔记</text><rect x="1014" y="16" width="72" height="38" rx="4" fill="#fff" stroke="#c9c9c3"/><text x="1050" y="40" text-anchor="middle" fill="#171717">删除</text><rect x="1096" y="16" width="92" height="38" rx="4" fill="#fff" stroke="#c9c9c3"/><text x="1142" y="40" text-anchor="middle" fill="#171717">回收站 0</text><rect x="1198" y="16" width="72" height="38" rx="4" fill="#fff" stroke="#c9c9c3"/><text x="1234" y="40" text-anchor="middle" fill="#171717">备份</text><rect x="1280" y="16" width="132" height="38" rx="4" fill="#fff" stroke="#c9c9c3"/><text x="1346" y="40" text-anchor="middle" fill="#171717">笔记信息</text></g>
  <g stroke="#c9c9c3"><rect x="0" y="71" width="220" height="779" fill="#f7f7f5"/><rect x="221" y="71" width="286" height="779" fill="#fff"/><rect x="508" y="71" width="932" height="779" fill="#fff"/></g>
  <g font-family="Microsoft YaHei" fill="#171717">
    <text x="24" y="105" font-family="Consolas" font-size="11" font-weight="700" fill="#6b6b66" letter-spacing="1.5">资料库</text><text x="24" y="140" font-size="18" font-weight="700">文件夹</text>
    <rect x="16" y="158" width="188" height="42" rx="3" fill="#e7e7e2"/><text x="32" y="184" font-size="15">全部笔记</text><text x="32" y="230" font-size="15">数据结构</text><text x="32" y="274" font-size="15">软件工程</text>
    <path d="M24 332H196" stroke="#c9c9c3"/><text x="24" y="363" font-size="14" font-weight="700" fill="#666">原型任务</text><text x="35" y="398" font-size="13" fill="#666">1. 新建笔记</text><text x="35" y="428" font-size="13" fill="#666">2. 编辑正文</text><text x="35" y="458" font-size="13" fill="#666">3. 右键查看信息</text>
    <text x="245" y="105" font-family="Consolas" font-size="11" font-weight="700" fill="#6b6b66" letter-spacing="1.5">当前资料库</text><text x="245" y="135" font-size="13" fill="#666">搜索标题与正文</text><rect x="245" y="149" width="238" height="40" rx="4" fill="#fff" stroke="#c9c9c3"/><text x="259" y="175" font-size="13" fill="#888">试试输入：栈</text>
    <rect x="245" y="208" width="238" height="92" rx="4" fill="#e7e7e2" stroke="#c9c9c3"/><text x="261" y="238" font-size="16" font-weight="700">栈与队列</text><text x="261" y="264" font-size="12" fill="#666">数据结构/栈与队列.md</text><text x="261" y="286" font-size="12" fill="#666">后进先出与先进先出…</text><text x="261" y="346" font-size="16" font-weight="700">表达式求值</text><text x="261" y="371" font-size="12" fill="#666">数据结构/表达式求值.md</text>
    <rect x="508" y="71" width="932" height="52" fill="#f7f7f5"/><path d="M508 123H1440" stroke="#c9c9c3"/><text x="532" y="103" font-size="14" font-weight="700">分栏</text><text x="596" y="103" font-size="14">编辑</text><text x="654" y="103" font-size="14">预览</text><text x="1283" y="103" font-size="12" fill="#666">已保存</text>
    <path d="M974 123V850" stroke="#c9c9c3"/><text x="542" y="174" font-family="Consolas" font-size="17"># 栈与队列</text><text x="542" y="222" font-family="Consolas" font-size="15">栈遵循后进先出，队列遵循先进先出。</text><text x="542" y="270" font-family="Consolas" font-size="15">关联：[[数据结构/表达式求值]]</text><text x="1007" y="182" font-size="29" font-weight="700">栈与队列</text><text x="1007" y="233" font-size="16">栈遵循后进先出，队列遵循先进先出。</text><text x="1007" y="282" font-size="16" text-decoration="underline">数据结构/表达式求值</text>
  </g>
  <g font-family="Microsoft YaHei" font-size="14"><rect x="1040" y="332" width="220" height="142" fill="#fff" stroke="#171717"/><rect x="1050" y="342" width="200" height="38" fill="#e7e7e2"/><text x="1065" y="366" fill="#171717">打开笔记信息</text><text x="1065" y="410" fill="#171717">插入双链</text><text x="1065" y="454" fill="#171717">复制笔记路径</text></g>
</svg>
